name: JSON connector

on:
  push:
    branches: [B, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build independent distributions
        run: |
          python -m pip install build
          python -m build . --outdir /tmp/core-dist
          python -m build plugins/json_connector --outdir /tmp/json-dist
          python -m pip install /tmp/core-dist/*.whl
      - name: Verify CSV without the plugin
        run: |
          python plugins/json_connector/tests/installation_smoke.py absent
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install JSON wheel and test public contract
        run: |
          python -m pip install /tmp/json-dist/*.whl
          python -m unittest discover -s plugins/json_connector/tests -v
          python plugins/json_connector/tests/installation_smoke.py installed
          experimentlens examples/experiments plugins/json_connector/examples/nested.json --sort-by f1 --strict-comparability -o /tmp/experimentlens-report.md --csv-output /tmp/experimentlens-summary.csv --html-output /tmp/experimentlens-report.html
          python -m pip check
      - name: Uninstall JSON plugin and verify CSV again
        run: |
          python -m pip uninstall -y experimentlens-json
          python plugins/json_connector/tests/installation_smoke.py absent
          python -m pip check
