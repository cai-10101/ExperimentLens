name: JSON connector

on:
  push:
    branches: [B, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      # A's public contract is pending PR #1. Pin the integration dependency.
      - uses: actions/checkout@v4
        with:
          ref: 4b7b5b8c25e7f1faab30b0d10c9e7f4b6c4f7a35
          path: .core-dependency
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build independent distributions
        run: |
          python -m pip install build
          python -m build .core-dependency --outdir /tmp/core-dist
          python -m build plugins/json_connector --outdir /tmp/json-dist
          python -m pip install /tmp/core-dist/*.whl
      - name: Verify CSV without the plugin
        run: |
          python plugins/json_connector/tests/installation_smoke.py absent
          python -m unittest discover -s .core-dependency/tests -p test_core.py -v
      - name: Install JSON wheel and test public contract
        run: |
          python -m pip install /tmp/json-dist/*.whl
          python -m unittest discover -s plugins/json_connector/tests -v
          python plugins/json_connector/tests/installation_smoke.py installed
          python -m pip check
      - name: Uninstall JSON plugin and verify CSV again
        run: |
          python -m pip uninstall -y experimentlens-json
          python plugins/json_connector/tests/installation_smoke.py absent
          python -m pip check
