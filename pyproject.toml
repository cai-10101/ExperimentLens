[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentlens"
version = "0.1.0"
description = "Core experiment records, CSV import, connector discovery, analysis, and reporting"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
experimentlens = "experimentlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
